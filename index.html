 '<label for="ae">Email</label><input id="ae" type="email" autocomplete="email"><label for="aw">Password</label><input id="aw" type="password" autocomplete="'+(tab==='up'?'new-password':'current-password')+'"><div class="msg" id="am">'+esc(msg)+'</div><button class="btn" onclick="auth()">'+(tab==='up'?'Account banayein':'Login karein')+'</button><p style="font-size:12px;color:var(--mute)">Note: account is device par save hota hai.</p></div>'}
function auth(){var e=$('ae').value.trim().toLowerCase(),w=$('aw').value,u=ls('ab_users')||{};
 if(!/^\S+@\S+\.\S+$/.test(e)||w.length<6){msg='Sahi email aur kam az kam 6 harf ka password likhein.';return render()}
 if(tab==='up'){var n=$('an').value.trim(),p=$('ap').value.trim();if(!n||p.length<7){msg='Naam aur phone number zaroori hai.';return render()}
  if(u[e]){msg='Ye email pehle se registered hai. Login karein.';return render()}
  u[e]={name:n,phone:p,email:e,pw:hs(w)};ls('ab_users',u)}
 else if(!u[e]||u[e].pw!==hs(w)){msg='Email ya password ghalat hai.';return render()}
 ls('ab_sess',e);me=u[e];msg='';view='menu';render()}
function logout(){ls('ab_sess','');me=null;render()}
function adsAdmin(){
 var h='<div class="pn"><h2>Ads / Offers</h2><p style="color:var(--mute);font-size:13px">Ye banners menu ke upar customers ko dikhte hain.</p>';
 (D.ads||[]).forEach(function(a,x){
  h+='<div class="ed"><div class="r"><input aria-label="Ad title" value="'+esc(a.t)+'" oninput="D.ads['+x+'].t=this.value"></div>'+
  '<div class="r"><input aria-label="Ad text" value="'+esc(a.d)+'" oninput="D.ads['+x+'].d=this.value"></div>'+
  '<div class="r"><select aria-label="Click par category" onchange="D.ads['+x+'].c=this.value"><option value="">Click par kuch nahi</option>'+D.cats.map(function(c){return'<option'+(c===a.c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'+
  '<div class="r"><input type="file" accept="image/*" aria-label="Ad tasveer" onchange="pic(\'ads\','+x+',this)">'+(a.img?'<button class="btn g" style="margin:0;width:auto;padding:8px 10px;min-height:44px" onclick="D.ads['+x+'].img=\'\';render()">Hatayein</button>':'')+'</div>'+
  '<div class="r"><label style="margin:0"><input type="checkbox" '+(a.on!==false?'checked':'')+' onchange="D.ads['+x+'].on=this.checked"> Chal raha hai</label><button class="btn g" style="margin:0;width:auto;padding:8px 12px" onclick="D.ads.splice('+x+',1);render()">Delete</button></div></div>'});
 return h+'<button class="btn g" onclick="addAd()">+ Naya Ad</button></div>'}
function addAd(){D.ads=D.ads||[];D.ads.push({id:'a'+Date.now(),t:'Naya offer',d:'Tafseel',c:'',img:'',on:true});render()}
function unlock(){if(hs($('apw').value)===D.pw){unlocked=true;msg='';render()}else{msg='Password ghalat hai.';$('am2').textContent=msg}}
function pic(a,x,inp){var f=inp.files[0],mx=a==='ads'?640:360;if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);D[a][x].img=c.toDataURL('image/jpeg',.78);render()};im.src=r.result};r.readAsDataURL(f)}
function adminV(){
 if(!unlocked)return'<div class="pn"><h2>Admin Login</h2><label for="apw">Password</label><input id="apw" type="password" autocomplete="current-password"><div class="msg" id="am2">'+esc(msg)+'</div><button class="btn" onclick="unlock()">Login</button><button class="btn g" onclick="go(\'menu\')">Wapas</button></div>';
 var h='<div class="pn"><h2>Menu Edit (Admin)</h2><label for="jc">JazzCash number</label><input id="jc" value="'+esc(D.pay.jc)+'" oninput="D.pay.jc=this.value"><label for="ep">Easypaisa number</label><input id="ep" value="'+esc(D.pay.ep)+'" oninput="D.pay.ep=this.value"><label for="bk">Bank account (IBAN, naam) - optional</label><input id="bk" value="'+esc(D.pay.bk)+'" oninput="D.pay.bk=this.value"><label for="npw">Naya admin password (khali chorein to wahi rahega)</label><input id="npw" type="password" autocomplete="new-password"><label for="wa">Restaurant WhatsApp number (country code ke saath)</label><input id="wa" value="'+esc(D.wa)+'" oninput="D.wa=this.value.replace(/\\D/g,\'\')"><label for="cs">Categories (comma se alag karein)</label><input id="cs" value="'+esc(D.cats.join(', '))+'" onchange="setCats(this.value)"></div>';
 h+=adsAdmin();
 h+=D.items.map(function(i,x){return'<div class="ed" style="margin:0 16px 10px;background:var(--card)"><div class="r"><div class="em" style="width:64px;height:64px;font-size:30px">'+(i.img?'<img alt="" src="'+i.img+'">':esc(i.e))+'</div><input type="file" accept="image/*" aria-label="Tasveer" onchange="pic(\'items\','+x+',this)">'+(i.img?'<button class="btn g" style="margin:0;width:auto;padding:8px 10px;min-height:44px" onclick="D.items['+x+'].img=\'\';render()">Hatayein</button>':'')+'</div><div class="r"><input style="width:64px;text-align:center" aria-label="Emoji" value="'+esc(i.e)+'" oninput="D.items['+x+'].e=this.value"><input aria-label="Naam" value="'+esc(i.n)+'" oninput="D.items['+x+'].n=this.value"></div><div class="r"><input aria-label="Tafseel" value="'+esc(i.d)+'" oninput="D.items['+x+'].d=this.value"></div><div class="r"><input type="number" aria-label="Price" style="width:96px" value="'+i.p+'" oninput="D.items['+x+'].p=+this.value||0"><select aria-label="Category" onchange="D.items['+x+'].c=this.value">'+D.cats.map(function(c){return'<option'+(c===i.c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select><label style="margin:0;white-space:nowrap"><input type="checkbox" '+(i.a!==false?'checked':'')+' onchange="D.items['+x+'].a=this.checked"> Available</label></div><div class="r"><button class="btn g" style="margin:0" onclick="delI('+x+')">Item delete karein</button></div></div>'}).join('');
 return h+'<div style="padding:0 16px"><button class="btn g" onclick="addI()">+ Naya item</button><div class="msg">'+esc(note)+'</div><button class="btn" onclick="save()">Save aur Publish karein</button></div>'}
function setCats(v){var c=v.split(',').map(function(s){return s.trim()}).filter(Boolean);if(c.length){D.cats=c;cat=c[0];D.items.forEach(function(i){if(c.indexOf(i.c)<0)i.c=c[0]});render()}}
function addI(){D.items.push({id:'n'+Date.now(),c:D.cats[0],n:'Naya item',d:'Tafseel',p:0,e:'🍽️',a:true});render();window.scrollTo(0,document.body.scrollHeight)}
function delI(x){D.items.splice(x,1);render()}
function build(){return'<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ar Bites</title>'+[].map.call(document.head.querySelectorAll('[data-k]'),function(e){return e.outerHTML}).join('')+'<style id="css">'+$('css').textContent+'</style></head><body><div id="root"></div><div id="dr"></div><script id="data" type="application/json">'+JSON.stringify(D).replace(/</g,'\\u003c')+'<\/script><script id="app">'+$('app').textContent+'<\/script></body></html>'}

 if(!art){note='Publish abhi available nahi hai.';return render()}
 note='Save ho raha hai...';render();art.publish(build()).then(function(){note='Save ho gaya! Page reload hoga.'}).catch(function(e){note='Save nahi hua ('+(e&&e.code||'error')+').';render()})}

function drHTML(){var b=tot()[0];
 return'<div class="ov" onclick="dr(false)"></div><aside class="dw" aria-label="Menu"><div class="dh">'+LOGO+'<div><b style="font-family:Georgia,serif;font-size:22px">'+esc(D.name)+'</b><br><small>'+(me?esc(me.name):'Khush amdeed!')+'</small></div></div>'+
 '<button onclick="dn(\'menu\')">Menu</button><button onclick="dof()">Offers</button><button onclick="dn(\'cart\')">Mera Cart'+(b?' ('+b+')':'')+'</button><button onclick="dn(\'acct\')">'+(me?'Mera Account':'Login / Sign up')+'</button>'+

 var b=tot()[0],v=view==='menu'?menuV():view==='cart'?cartV():view==='acct'?acctV():adminV();

 $('root').innerHTML=topbar()+v+'<nav class="nav">'+nb('menu','Menu')+nb('cart','Cart',b?'<span class="bd">'+b+'</span>':'')+nb('acct',me?'Account':'Login')+(unlocked?nb('admin','Admin'):'')+'</nav>'}
